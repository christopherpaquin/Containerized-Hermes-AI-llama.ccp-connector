#
# compose.yaml for Hermes Agent, configured against a llama.cpp llama-server
# running natively on this host (127.0.0.1:8080).
#
# This mirrors NousResearch/hermes-agent's own docker-compose.yml (two
# services, network_mode: host, ~/.hermes:/opt/data, HERMES_UID/HERMES_GID),
# swapping the repo's `build: .` for the published, version-pinned
# nousresearch/hermes-agent image.
#
# Usage: ./deploy.sh (sets HERMES_UID/HERMES_GID in .env automatically)
#
name: hermes

services:
  gateway:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent}:${HERMES_IMAGE_TAG:-v2026.8.13}
    container_name: hermes
    restart: unless-stopped
    # llama.cpp already listens on 127.0.0.1:8080 on this host; host
    # networking lets the container reach it directly with no
    # host.docker.internal / bridge / proxy indirection.
    network_mode: host
    # Playwright/Chromium (browser automation tool) needs real shared memory
    # or it crashes/degrades under the default 64MB /dev/shm.
    shm_size: "1gb"
    volumes:
      - ~/.hermes:/opt/data
      # Once an NFS share exists, mount it here and point
      # HERMES_CRON_BACKUP_DEST at this path for a real off-volume backup:
      # - /mnt/hermes-nfs-backup:/opt/backups
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # Gateway's own OpenAI-compatible API server (for external clients to
      # talk to the Hermes *agent*, not a passthrough to the local model).
      # Off unless API_SERVER_ENABLED=true. See README Security notes.
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-false}
      - API_SERVER_HOST=${API_SERVER_HOST:-127.0.0.1}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      # Read by ~/.hermes/scripts/backup-hermes-data.sh when triggered by
      # Hermes's own cron. Defaults to a subdirectory of the same volume;
      # point it at a mounted NFS share (add the matching volume below) for
      # a real off-volume backup. See README "Backups".
      - HERMES_CRON_BACKUP_DEST=${HERMES_CRON_BACKUP_DEST:-/opt/data/backups}
      - HERMES_CRON_BACKUP_KEEP=${HERMES_CRON_BACKUP_KEEP:-14}
    command: ["gateway", "run"]

  dashboard:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent}:${HERMES_IMAGE_TAG:-v2026.8.13}
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # Only used when HERMES_DASHBOARD_HOST is non-loopback. Hermes's
      # dashboard auth gate engages automatically on any non-loopback bind
      # and refuses to start without a provider -- see README Security notes.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
    command: ["dashboard", "--host", "${HERMES_DASHBOARD_HOST:-127.0.0.1}", "--no-open"]
